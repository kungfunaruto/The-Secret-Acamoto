<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be my girlfriend?</title>
</head>
<body style="margin:0;">
<div id="eve-proposal-root">
  <style>
    #eve-proposal-root {
      --pink: #FF6FA5;
      --pink-soft: #FFD1E3;
      --lavender: #B388EB;
      --lavender-soft: #E7DBFB;
      --cream: #FFF6FA;
      --plum: #4A2545;
      --gold: #FFD866;

      font-family: "Bebas Neue", sans-serif;
      position: relative;
      width: 100%;
      min-height: 100svh;
      min-height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 20% 10%, #FFE9F2 0%, transparent 45%),
                  radial-gradient(circle at 85% 85%, #EEE0FF 0%, transparent 50%),
                  linear-gradient(150deg, var(--cream) 0%, var(--lavender-soft) 100%);
      color: var(--plum);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      box-sizing: border-box;
    }

    #eve-proposal-root * { box-sizing: border-box; }

    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap');

    .heart-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -40px;
      opacity: 0.55;
      animation-name: floatUp;
      animation-timing-function: ease-in;
      animation-iteration-count: infinite;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.6; }
      100% { transform: translateY(-680px) translateX(var(--drift, 20px)) rotate(25deg); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 26px;
      padding: clamp(26px, 6.5vw, 48px) clamp(20px, 5.5vw, 44px) clamp(26px, 5.5vw, 44px);
      width: 600px;
      height: 1200px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 20px 50px -18px rgba(179, 136, 235, 0.45);
      display: flex;
      flex-direction: column;
    }

    .eyebrow {
      font-family: "Bebas Neue", sans-serif;
      font-size: 15.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .bear {
      font-size: clamp(100px, 9vw, 120px);
      margin-bottom: 4px;
      display: inline-block;
      animation: wiggle 3.2s ease-in-out infinite;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }

    h1 {
      font-family: "Bebas Neue", sans-serif;
      font-weight: 700;
      font-size: clamp(35px, 5.6vw, 45px);
      line-height: 1.34;
      margin: 6px 0 12px;
      color: var(--plum);
    }

    .subtext {
      font-size: clamp(15px, 3.6vw, 18px);
      line-height: 1.6;
      color: #6B4A73;
      margin: 0 auto clamp(18px, 4.5vw, 26px);
      max-width: 360px;
    }

    /* dedicated bounded area for the roaming "no" button + growing "yes" button */
    .roam-zone {
      position: relative;
      width: 100%;
      min-height: clamp(170px, 42vw, 230px);
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      font-family: "Bebas Neue", sans-serif;
      font-weight: 600;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      white-space: nowrap;
      transition: transform 0.15s ease, box-shadow 0.2s ease, font-size 0.25s ease, padding 0.25s ease, opacity 0.2s ease, width 0.3s ease, height 0.3s ease, border-radius 0.3s ease, top 0.25s ease, left 0.25s ease;
      touch-action: manipulation;
    }

    .yes-btn {
      background: linear-gradient(135deg, var(--pink), #FF9AC2);
      color: #fff;
      padding: 16px 32px;
      font-size: clamp(30px, 4vw, 50px);
      box-shadow: 0 12px 24px -8px rgba(255, 111, 165, 0.6);
      z-index: 54;
    }

    .yes-btn:active {
      transform: scale(0.97);
    }

    /* once growth starts, pin the yes button to the exact center of the
       roam-zone so it scales outward symmetrically instead of drifting */
    .yes-btn.growing {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .yes-btn.fullscreen {
      position: fixed;
      inset: 0;
      left: 50%;
      top: 50%;
      width: 100vw;
      height: 100dvh;
      border-radius: 0;
      font-size: clamp(30px, 8vw, 48px);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .no-btn {
      position: relative;
      background: #fff;
      color: #9B7EA8;
      border: 1.5px solid #E7D3EE;
      padding: 18px 30px;
      font-size: 30px;
      z-index: 58;
    }

    .no-btn.roaming {
      position: absolute;
    }

    .no-btn:active {
      transform: scale(0.94);
    }

    .hint {
      margin-top: 14px;
      font-size: 25px;
      color: #B79CC0;
      min-height: 16px;
      
    }

    /* celebration state */
    .card.celebrating h1 { color: var(--pink); }

    .confetti-piece {
      position: fixed;
      top: -20px;
      pointer-events: none;
      z-index: 70;
      animation-name: confettiFall;
      animation-timing-function: linear;
      animation-iteration-count: 1;
    }

    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(720px) rotate(400deg); opacity: 0; }
    }

    .celebrate-emoji {
      font-size: clamp(38px, 9vw, 54px);
      margin-bottom: 8px;
      animation: pop 0.5s ease;
    }

    @keyframes pop {
      0% { transform: scale(0); }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .floating-heart, .bear, .confetti-piece, .celebrate-emoji { animation: none !important; }
    }
  </style>

  <div class="heart-field" id="heartField"></div>

  <div class="card" id="mainCard">
    <div id="askScreen" style="display:flex; flex-direction:column; flex:1;">

      <div class="bear">💌</div>
      <h1 style="margin-top:50px; margin-bottom:50px;">Yves, I really like you, and I’d love to make things official. Will you be my girlfriend?</h1>
      <p class="subtext">
❤️❤️❤️
      </p>

      <div class="roam-zone" id="roamZone">
        <button class="yes-btn" id="yesBtn">YES 💖</button>
        <button class="no-btn" id="noBtn">NO</button>
      </div>

      <div class="hint" id="hint">Pls Don't Press No</div>
    </div>

    <div id="celebrateScreen" style="display:none;">
      <div class="celebrate-emoji" style="font-size:120px; margin-top:50px;">💗</div>
      <h1 style="font-size:50px; margin-top:50px;">Yay! You’re my girlfriend now! ❤️</h1>
      <p class="subtext"style="font-size:30px; margin-top:50px; font-family: 'Italianno', cursive;">
        From now on, I will do my best to make Yves smile like this every day
      </p>
      <div style="font-size:50px; margin-top:150px; font-family: 'Italianno', cursive;" class="subtext">6 August 2026</div>
    </div>
  </div>

  <script>
    (function() {
      const root = document.getElementById('eve-proposal-root');
      const heartField = root.querySelector('#heartField');
      const noBtn = root.querySelector('#noBtn');
      const yesBtn = root.querySelector('#yesBtn');
      const hint = root.querySelector('#hint');
      const askScreen = root.querySelector('#askScreen');
      const celebrateScreen = root.querySelector('#celebrateScreen');
      const card = root.querySelector('#mainCard');
      const roamZone = root.querySelector('#roamZone');

      const STORAGE_KEY = 'eve_proposal_answered';

      // safe wrappers — sessionStorage can throw in some sandboxed / private
      // browsing contexts, so never let it break the page
      function saveAnswered() {
        try { sessionStorage.setItem(STORAGE_KEY, 'yes'); } catch (e) {}
      }
      function hasAnswered() {
        try { return sessionStorage.getItem(STORAGE_KEY) === 'yes'; } catch (e) { return false; }
      }

      // floating hearts background
      const hearts = ['💗','💕','💖','🌸','💐'];
      for (let i = 0; i < 12; i++) {
        const h = document.createElement('div');
        h.className = 'floating-heart';
        h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        h.style.left = Math.random() * 96 + '%';
        h.style.fontSize = (13 + Math.random() * 16) + 'px';
        h.style.animationDuration = (7 + Math.random() * 6) + 's';
        h.style.animationDelay = (Math.random() * 8) + 's';
        h.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
        heartField.appendChild(h);
      }

      // capture the "no" button's TRUE, untransformed size once up front.
      const noBtnBaseW = noBtn.offsetWidth;
      const noBtnBaseH = noBtn.offsetHeight;

      let clickCount = 0;
      const MAX_STEPS = 8;
      const MIN_SCALE = 0.42;
      const hints = [
        'Huh? How did it run away? 😳',
        'The button got smaller now 👀',
        'Wanna try again?',
        'It is getting smaller and smaller now 🥺',
        'The pink button is getting bigger and bigger 💗',
        'It is almost filling the whole screen 😳',
        'Just give up already 🥹',
        'There is no room left for "No" 💗'
      ];

      function moveNoButtonWithinZone(scale) {
        const margin = 6;
        const w = noBtnBaseW * scale;
        const h = noBtnBaseH * scale;

        const zoneW = roamZone.clientWidth;
        const zoneH = roamZone.clientHeight;

        const maxX = Math.max(margin, zoneW - w - margin);
        const maxY = Math.max(margin, zoneH - h - margin);

        const newX = margin + Math.random() * (maxX - margin);
        const newY = margin + Math.random() * (maxY - margin);

        noBtn.style.left = newX + 'px';
        noBtn.style.top = newY + 'px';
      }

      function updateNoButton() {
        const scale = Math.max(MIN_SCALE, 1 - clickCount * 0.08);
        const opacity = Math.max(0.65, 1 - clickCount * 0.04);

        if (!noBtn.classList.contains('roaming')) {
          noBtn.classList.add('roaming');
        }

        noBtn.style.transformOrigin = 'top left';
        moveNoButtonWithinZone(scale);
        noBtn.style.transform = 'scale(' + scale + ')';
        noBtn.style.opacity = opacity;
      }

      function updateYesButton() {
        const step = Math.min(clickCount, MAX_STEPS);

        if (!yesBtn.classList.contains('growing')) {
          yesBtn.classList.add('growing');
        }

        if (step >= MAX_STEPS) {
          yesBtn.classList.add('fullscreen');
          yesBtn.style.transform = '';
          return;
        }

        const scale = 1 + step * 0.2;
        yesBtn.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
      }

      noBtn.addEventListener('click', function() {
        clickCount++;
        hint.textContent = hints[Math.min(clickCount - 1, hints.length - 1)];
        updateNoButton();
        updateYesButton();
      });

      // re-clamp position if the viewport/card size changes (rotation etc.)
      window.addEventListener('resize', function() {
        if (clickCount > 0 && !yesBtn.classList.contains('fullscreen')) {
          const scale = Math.max(MIN_SCALE, 1 - clickCount * 0.08);
          moveNoButtonWithinZone(scale);
        }
      });

      function launchConfetti() {
        const colors = ['#FF6FA5', '#B388EB', '#FFD866', '#FF9AC2', '#C9A6F0'];
        for (let i = 0; i < 50; i++) {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.textContent = Math.random() > 0.5 ? '💗' : '✨';
          piece.style.left = Math.random() * 100 + 'vw';
          piece.style.fontSize = (10 + Math.random() * 14) + 'px';
          piece.style.color = colors[Math.floor(Math.random() * colors.length)];
          piece.style.animationDuration = (2 + Math.random() * 1.8) + 's';
          piece.style.animationDelay = (Math.random() * 0.5) + 's';
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 4300);
        }
      }

      function showCelebrateScreen(withConfetti) {
        askScreen.style.display = 'none';
        celebrateScreen.style.display = 'block';
        card.classList.add('celebrating');
        if (withConfetti) {
          launchConfetti();
          setTimeout(launchConfetti, 450);
        }
      }

      yesBtn.addEventListener('click', function() {
        saveAnswered();
        showCelebrateScreen(true);
      });

      // on page load: if this tab's session already has a "yes" answer,
      // jump straight to the celebrate screen (no confetti replay).
      // closing the tab/browser clears sessionStorage automatically,
      // so a fresh visit always starts back at the question.
      if (hasAnswered()) {
        showCelebrateScreen(false);
      }
    })();
  </script>
</div>
</body>
</html>
